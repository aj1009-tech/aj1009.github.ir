<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Savings Goal Calculator | Ananya Jaising</title><style>*{box-sizing:border-box}body{margin:0;padding:40px 20px;background:#fff7f2;color:#332536;font:16px/1.6 Arial,sans-serif}main{max-width:700px;margin:auto}a{color:#8d3774}h1{font-size:clamp(2rem,6vw,3.5rem);line-height:1.1}.card{background:white;border:2px solid #473648;border-radius:20px;padding:25px;margin:25px 0;box-shadow:6px 6px 0 #473648}label{display:block;font-weight:bold;margin:18px 0 6px}input{width:100%;padding:12px;border:2px solid #473648;border-radius:9px;font:inherit}.result{background:#d7f2e8;border-radius:12px;padding:16px;margin-top:12px}.result strong{display:block;font-size:1.5rem}.track{height:20px;background:#eee5eb;border:2px solid #473648;border-radius:20px;overflow:hidden;margin-top:20px}.fill{height:100%;width:0;background:#ef8eb3}small{color:#665467}</style></head><body><main><a href="../index.html#projects">← Back to portfolio</a><h1>Savings Goal Calculator ✨</h1><p>Set a goal and explore how monthly deposits and interest could affect your progress.</p><div class="card"><label for="starting">Starting balance ($)</label><input id="starting" type="number" min="0" value="500"><label for="monthly">Monthly contribution ($)</label><input id="monthly" type="number" min="0" value="150"><label for="rate">Estimated annual interest rate (%)</label><input id="rate" type="number" min="0" step="0.1" value="3"><label for="months">Time (whole months)</label><input id="months" type="number" min="1" max="600" step="1" value="24"><label for="goal">Savings goal ($)</label><input id="goal" type="number" min="1" value="5000"></div><div class="card" aria-live="polite"><div class="result">Projected balance<strong id="balance"></strong></div><p id="breakdown"></p><div class="track" role="img" aria-label="Progress toward savings goal"><div class="fill" id="fill"></div></div><p id="progress"></p></div><small>Assumes monthly compounding and deposits at the end of each month. Educational estimate, not a guarantee.</small></main><script>const fields=['starting','monthly','rate','months','goal'].map(id=>document.getElementById(id));const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n);function calculate(){const [start,monthly,rate,months,goal]=fields.map(x=>Number(x.value));if(fields.some(x=>x.value==='')||[start,monthly,rate,months,goal].some(x=>!Number.isFinite(x))||start<0||monthly<0||rate<0||!Number.isInteger(months)||months<1||months>600||goal<=0){document.getElementById('balance').textContent='—';document.getElementById('breakdown').textContent='';document.getElementById('fill').style.width='0%';document.getElementById('progress').textContent='Enter valid nonnegative amounts and 1–600 whole months.';return}let balance=start;for(let i=0;i<months;i++)balance=balance*(1+rate/1200)+monthly;const contributed=start+monthly*months,interest=balance-contributed;document.getElementById('balance').textContent=money(balance);document.getElementById('breakdown').textContent='Your contributions: '+money(contributed)+' · Estimated interest: '+money(interest);document.getElementById('fill').style.width=Math.min(balance/goal*100,100)+'%';document.getElementById('progress').textContent=balance>=goal?'You reach your goal in this projection! 🎉':'You would be '+money(goal-balance)+' away from your goal.'}fields.forEach(x=>x.addEventListener('input',calculate));calculate()</script></body></html>
