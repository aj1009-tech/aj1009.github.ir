<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FX Hedge Simulator | Ananya Jaising</title><style>*{box-sizing:border-box}body{margin:0;padding:40px 20px;background:#fff7f2;color:#332536;font:16px/1.6 Arial,sans-serif}main{max-width:700px;margin:auto}a{color:#8d3774}h1{font-size:clamp(2rem,6vw,3.5rem);line-height:1.1}.card{background:white;border:2px solid #473648;border-radius:20px;padding:25px;margin:25px 0;box-shadow:6px 6px 0 #473648}label{display:block;font-weight:bold;margin:18px 0 6px}input{width:100%;padding:12px;border:2px solid #473648;border-radius:9px;font:inherit}.result{background:#e8dbfa;border-radius:12px;padding:14px;margin:12px 0}.result strong{display:block;font-size:1.4rem}small{color:#665467}</style></head><body><main><a href="../index.html#projects">← Back to portfolio</a><h1>FX Hedge Simulator 💱</h1><p>Explore how locking an exchange rate changes the dollar cost of a future euro payment.</p><div class="card"><label for="euros">Future payment (€)</label><input id="euros" type="number" min="0" value="10000"><label for="locked">Locked rate (USD per EUR)</label><input id="locked" type="number" min="0.001" step="0.01" value="1.10"><label for="future">Future market rate (USD per EUR)</label><input id="future" type="number" min="0.001" step="0.01" value="1.18"></div><div class="card" aria-live="polite"><div class="result">Cost without hedge<strong id="unhedged"></strong></div><div class="result">Cost with locked rate<strong id="hedged"></strong></div><div class="result">Difference<strong id="difference"></strong></div><p id="explanation"></p></div><small>Educational illustration. This simplified model excludes fees, spreads, and other real-world considerations.</small></main><script>const inputs=['euros','locked','future'].map(id=>document.getElementById(id));const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n);function calculate(){const [amount,lockedRate,futureRate]=inputs.map(x=>Number(x.value));const out=document.getElementById('explanation');if(inputs.some(x=>x.value==='')||!Number.isFinite(amount)||!Number.isFinite(lockedRate)||!Number.isFinite(futureRate)||amount<0||lockedRate<=0||futureRate<=0){['unhedged','hedged','difference'].forEach(id=>document.getElementById(id).textContent='—');out.textContent='Enter a payment of zero or more and positive exchange rates.';return}const unhedged=amount*futureRate,hedged=amount*lockedRate,diff=unhedged-hedged;document.getElementById('unhedged').textContent=money(unhedged);document.getElementById('hedged').textContent=money(hedged);document.getElementById('difference').textContent=money(Math.abs(diff));out.textContent=diff>0?'The locked rate lowers the dollar cost in this scenario.':diff<0?'The market rate would have been cheaper. The hedge provided certainty but gave up that benefit.':'The two rates produce the same cost.'}inputs.forEach(x=>x.addEventListener('input',calculate));calculate()</script></body></html>
